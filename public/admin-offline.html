<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#a4634d" />
    <title>Offline · Beheer</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf8f5; --fg: #2b2a28; --accent: #a4634d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161514; --fg: #efebe6; --accent: #d79a83; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 .5rem; }
      p { opacity: .7; line-height: 1.5; }
      button { margin-top: 1rem; border: 0; border-radius: 999px; padding: .6rem 1.4rem; font: inherit;
        background: var(--accent); color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Geen verbinding</h1>
      <p>Het beheer heeft internet nodig. Controleer je verbinding en probeer het opnieuw.</p>
      <button type="button" onclick="location.reload()">Opnieuw proberen</button>
    </main>
  </body>
</html>
