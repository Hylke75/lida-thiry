name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Dummywaarden: de build mag geen echte geheimen nodig hebben.
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # End-to-end- en toegankelijkheidstests tegen een lokale productiebuild, zonder
    # database of geheimen (zie scripts/e2e-lokaal.mjs en docs/testen.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Playwright-browser installeren (alleen Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E en toegankelijkheid (npm run e2e:lokaal)
        run: npm run e2e:lokaal
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Playwright-resultaten bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultaten
          path: test-results/
          retention-days: 7
